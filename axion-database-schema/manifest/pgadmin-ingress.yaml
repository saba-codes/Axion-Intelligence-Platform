apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pgadmin-ingress

spec:
  ingressClassName: nginx
  rules:
  - host: pgadminui.dabbewale.shop
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: pgadmin-srv
            port: 
              number: 80
