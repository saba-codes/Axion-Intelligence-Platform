apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingestion-myingress

spec:
  ingressClassName: nginx
  rules:
  - host: ingestionservice.dabbewale.shop
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: ingestion-service
            port: 
              number: 80
