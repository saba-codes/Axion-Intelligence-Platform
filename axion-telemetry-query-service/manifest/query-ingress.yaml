apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: query-ingress

spec:
  ingressClassName: nginx
  rules:
  - host: query-service.dabbewale.shop
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: query-service
            port: 
              number: 80
